[[permission]]
identifier = "allow-get-app-bootstrap"
description = "Read application bootstrap state."
commands.allow = ["get_app_bootstrap"]

[[permission]]
identifier = "allow-complete-onboarding"
description = "Create the initial local household."
commands.allow = ["complete_onboarding"]

[[permission]]
identifier = "allow-get-dashboard-summary"
description = "Read the household dashboard summary."
