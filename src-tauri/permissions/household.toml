[[permission]]
identifier = "allow-get-dashboard-data"
description = "Read the Phase 4 household dashboard."
commands.allow = ["get_dashboard_data"]

[[permission]]
identifier = "allow-get-spending-view"
description = "Read local accounts, transactions, and spending summaries."
