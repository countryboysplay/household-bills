[[permission]]
identifier = "allow-get-calendar-data"
description = "Read paycheck and bill calendar events."
commands.allow = ["get_calendar_data"]

[[permission]]
identifier = "allow-get-history-data"
description = "Read household activity, payment, and reconciliation history."
commands.allow = ["get_history_data"]

[[permission]]
identifier = "allow-get-payment-guidance"
description = "Read explicit bill payment guidance from the deterministic schedule."
