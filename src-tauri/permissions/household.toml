[[permission]]
identifier = "allow-list-paycheck-schedules"
description = "List recurring household paycheck schedules."
commands.allow = ["list_paycheck_schedules"]

[[permission]]
identifier = "allow-save-paycheck-schedule"
description = "Create or update a recurring household paycheck schedule."
commands.allow = ["save_paycheck_schedule"]

[[permission]]
identifier = "allow-run-scheduler"
description = "Recalculate the deterministic household schedule."
